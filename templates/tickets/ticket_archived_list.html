{% extends "base.html" %}
{% block title %}Archived Tickets{% endblock %}
{% block content %}
<h3>Archived Tickets</h3>

<div class="list-group">
  {% for t in page.object_list %}
    <a class="list-group-item list-group-item-action" href="{% url 'ticket_detail' t.pk %}">
      <strong>{{ t.display_id }}</strong> — {{ t.title }}
      <div class="small text-muted">{{ t.status }} | {{ t.priority }} | {{ t.updated_at }}</div>
    </a>
  {% empty %}
    <div class="alert alert-info">No archived tickets.</div>
  {% endfor %}
</div>
{% endblock %}
